name: bingo
description: "Stay calm. Stay organized. Grow every day."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # UI & Animations
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  animated_text_kit: ^4.2.2

  # Navigation
  go_router: ^12.1.3

  # Icons & Fonts
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  iconsax: ^0.0.8

  # Utilities
  uuid: ^4.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^20.1.0
  haptic_feedback: ^0.5.1+1
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.2
  flutter_staggered_animations: ^1.1.1
  blur: ^4.0.0
  spring: ^1.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  


